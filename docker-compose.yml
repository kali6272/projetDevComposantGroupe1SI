services:
  # ---------------------------------------------------------------
  # Fournisseur d'identité
  # ---------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------
  # Bases de données (une par API : les API sont indépendantes)
  # ---------------------------------------------------------------
  products-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD:-products}
    volumes:
      - ./products-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - products-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 5s
      retries: 20

  suppliers-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suppliers
      POSTGRES_USER: suppliers
      POSTGRES_PASSWORD: ${SUPPLIERS_DB_PASSWORD:-suppliers}
    volumes:
      - ./suppliers-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - suppliers-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppliers -d suppliers"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------
  # API REST (non exposées sur l'hôte : accessibles uniquement via Kong)
  # ---------------------------------------------------------------
  products-api:
    build: ./products-api
    environment:
      PGHOST: products-db
      PGDATABASE: products
      PGUSER: products
      PGPASSWORD: ${PRODUCTS_DB_PASSWORD:-products}
    expose:
      - "3000"
    depends_on:
      products-db:
        condition: service_healthy

  suppliers-api:
    build: ./suppliers-api
    environment:
      PGHOST: suppliers-db
      PGDATABASE: suppliers
      PGUSER: suppliers
      PGPASSWORD: ${SUPPLIERS_DB_PASSWORD:-suppliers}
    expose:
      - "3000"
    depends_on:
      suppliers-db:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Génère kong.yml avec la clé publique RSA actuelle de Keycloak
  # (plus aucune copie manuelle de clé)
  # ---------------------------------------------------------------
  kong-init:
    image: node:18-alpine
    command: ["node", "/kong/init/generate-kong-config.js"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ibam-realm
      TEMPLATE_PATH: /kong/kong.template.yml
      OUTPUT_PATH: /kong-config/kong.yml
    volumes:
      - ./kong:/kong:ro
      - kong-config:/kong-config
    depends_on:
      - keycloak
    restart: "no"

  # ---------------------------------------------------------------
  # Passerelle API (Kong OSS, mode DB-less)
  # ---------------------------------------------------------------
  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong-config/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - kong-config:/kong-config:ro
    ports:
      - "8000:8000"
      # API d'administration accessible uniquement depuis la machine locale
      - "127.0.0.1:8001:8001"
    depends_on:
      kong-init:
        condition: service_completed_successfully
      products-api:
        condition: service_started
      suppliers-api:
        condition: service_started

  # ---------------------------------------------------------------
  # Tests de bout en bout (lancés à la demande)
  #   docker compose --profile test run --rm tests
  # ---------------------------------------------------------------
  tests:
    image: node:18-alpine
    profiles: ["test"]
    working_dir: /tests
    command: ["node", "run-tests.js"]
    environment:
      KONG_URL: http://kong:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ibam-realm
    volumes:
      - ./tests:/tests:ro
    depends_on:
      - kong

volumes:
  products-data:
  suppliers-data:
  kong-config:
